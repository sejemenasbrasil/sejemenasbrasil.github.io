<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seje Menas</title>
<meta name="description" content="Humor brasileiro sobre as pequenas hipocrisias do dia a dia. Siga o canal e baixe os stickers.">
<link rel="icon" href="images/icon/logo_transparent.png">

<meta property="og:title" content="Seje Menas">
<meta property="og:description" content="Humor brasileiro sobre as pequenas hipocrisias do dia a dia.">
<meta property="og:image" content="https://sejemenasbrasil.github.io/images/icon/logo.png">
<meta property="og:url" content="https://sejemenasbrasil.github.io/">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">

<style>
  :root {
    --bg: #ffffff;
    --fg: #16181d;
    --muted: #5b6270;
    --rule: #e3e6ea;
    --card: #f7f8fa;
    --sheet: #ffffff;           /* fundo claro fixo: a arte dos stickers e preta */
    --logo-filter: none;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #101216;
      --fg: #e8eaed;
      --muted: #a2a9b5;
      --rule: #272b33;
      --card: #171a20;
      --sheet: #f2f3f5;
      --logo-filter: invert(1); /* o logo e preto sobre fundo transparente */
    }
  }
  :root[data-theme="dark"] {
    --bg: #101216;
    --fg: #e8eaed;
    --muted: #a2a9b5;
    --rule: #272b33;
    --card: #171a20;
    --sheet: #f2f3f5;
    --logo-filter: invert(1);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 48px 16px 72px;
  }
  main { max-width: 480px; margin: 0 auto; }

  /* --- topo --- */
  .hero { text-align: center; }
  .hero img {
    width: min(260px, 72vw);
    height: auto;
    display: block;
    margin: 0 auto;
    filter: var(--logo-filter);
  }
  .tagline {
    color: var(--muted);
    margin: 14px 0 34px;
    font-size: 1.02rem;
  }

  /* --- links --- */
  .links { display: grid; gap: 10px; }
  .links a {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 18px;
    border: 1px solid var(--rule);
    border-radius: 12px;
    background: var(--card);
    color: var(--fg);
    text-decoration: none;
    font-weight: 600;
    transition: transform 0.12s ease, border-color 0.12s ease;
  }
  .links a:hover { transform: translateY(-1px); border-color: var(--muted); }
  .links svg { flex: none; width: 20px; height: 20px; fill: currentColor; }

  /* --- secao --- */
  section { margin-top: 46px; }
  h2 { font-size: 1.1rem; margin: 0 0 6px; letter-spacing: -0.01em; }
  .hint { color: var(--muted); font-size: 0.92rem; margin: 0 0 18px; }

  /* --- stickers --- */
  .stickers {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }
  .stickers a {
    display: block;
    background: var(--sheet);
    border: 1px solid var(--rule);
    border-radius: 12px;
    padding: 10px;
    text-decoration: none;
    transition: transform 0.12s ease, border-color 0.12s ease;
  }
  .stickers a:hover { transform: translateY(-2px); border-color: var(--muted); }
  .stickers img {
    width: 100%;
    height: 92px;
    object-fit: contain;
    display: block;
  }
  .stickers span {
    display: block;
    text-align: center;
    margin-top: 8px;
    font-size: 0.72rem;
    font-weight: 700;
    color: #5b6270;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .download-all {
    display: block;
    margin-top: 10px;
    padding: 13px 18px;
    text-align: center;
    border: 1px solid var(--rule);
    border-radius: 12px;
    background: var(--card);
    color: var(--fg);
    text-decoration: none;
    font-weight: 600;
  }
  .download-all:hover { border-color: var(--muted); }

  footer {
    margin-top: 46px; padding-top: 18px;
    border-top: 1px solid var(--rule);
    color: var(--muted); font-size: 0.85rem;
    text-align: center;
  }
  footer a { color: var(--muted); }

  @media (max-width: 380px) {
    .stickers { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
